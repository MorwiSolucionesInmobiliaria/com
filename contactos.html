body {

.menu6 a {

.formulario {

    display: block; 
    clear: both;
    max-width: 90%; 
}

/* 🔥 MEJORA: Título del formulario principal ahora es oscuro para contrastar con fondo blanco */
.formulario h1 {
    color: #133055; 
    font-size: 28px;
    margin-bottom: 20px;
}


.formulario input[type="text"],
.formulario input[type="tel"],
.formulario input[type="email"],
.formulario textarea {
  width: 90%;
  height: 40px;
  margin-bottom: 20px;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 5px;
}
.formulario input[type="text"]:focus,
.formulario input[type="tel"]:focus,
.formulario input[type="email"]:focus,
.formulario textarea:focus {
  border-color: #aaa;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
.formulario textarea {
  height: 100px;
}
.formulario button[type="submit"] {
  width: 100%;
  height: 40px;
 background-color: #133055b3; /* Color de botón mejorado */
  color: #fff;
  padding: 10px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}


/*        FORMULARIO CONTACTO (LOG)    */


.log {
    background-color: #133055e0; /* Color coherente */
    max-width: 500px;
    width: 90%;
    margin: 0; 
    padding: 25px;
    border-radius: 15px;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;   
    align-items: center;       
    gap: 25px;                 
}

h5 {
    font-size: 28px;
    margin: 10px;
    color: white;
}

h4 {
    font-size: 16px;
    color: aliceblue;
}


/*            REDES               */

.redes {
    display: flex;
    justify-content: center;   
    align-items: center;       
    gap: 35px;                 
}

.redes-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 90px;               
}

.redes-item img {
    width: 60px;
    height: 60px;
    object-fit: contain;
    transition: transform 0.3s;
}

.redes-item img:hover {
    transform: scale(1.2);
}

.redes-item h4 {
    margin-top: 8px;
    font-size: 14px;
    color: white;
}

.logoo {
    border-radius: 20px;
}


/* ============================== */
/*      MEDIA QUERIES (MÓVIL)     */
/* ============================== */

@media (max-width: 768px) {
    /* En móviles, los contenedores .formulario y .log se apilan automáticamente por flex-wrap: wrap; */
    .formulario {
        margin-bottom: 20px; /* Añade espacio entre los dos formularios apilados */
    }

    .header h1 {
        font-size: 26px;
        text-align: center;
    }
    
    .menu6 {

        padding: 15px;
    }

    h5 {
        font-size: 24px;
    }
}

@media (max-width: 480px) {
    .header {

        padding: 15px;
    }

        font-size: 22px;
    }

    .redes {
        gap: 15px; 
    }
    
    .redes-item img {
        width: 45px;
        height: 45px;
    }

    .redes-item h4 {
        font-size: 12px;
    }
}
