<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje Enviado - Gracias</title>

    <style>
        body {
            margin: 0;
            font-family: 'Trebuchet MS', Arial, sans-serif;
            background-color: #eaf2f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .contenedor {
            background: #ffffff;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .contenedor h1 {
            color: #133055;
            margin-bottom: 15px;
        }

        .contenedor p {
            font-size: 18px;
            color: #333;
        }

        .btn-volver {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #133055;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-volver:hover {
            background: #0e2340;
        }

        .icono-check {
            width: 80px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <img src="8986fef7a58272135c7c5d006a312554.gif" class="icono-check" alt="Éxito">
        <h1>¡Mensaje Enviado!</h1>
        <p>Gracias por contactarte con <strong>Morwi Soluciones Inmobiliarias</strong>.<br>
        Te responderemos lo antes posible.</p>

        <a href="index.html" class="btn-volver">Volver al Inicio</a>
    </div>

</body>
</html>
