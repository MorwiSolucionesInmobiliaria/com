<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

<title>Morwi Soluciones Inmobiliarias</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ========= VARIABLES ========= */
:root{
    --primary:#133055;
    --primary-dark:#0b1f3a;
    --accent:#ffcc00;
    --white:#fff;
    --glass:rgba(19,48,85,.78);
    --radius:18px;
    --shadow:0 20px 50px rgba(0,0,0,.35);
    --transition:.35s ease;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

/* ========= RESET ========= */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    font-family:var(--font);
    min-height:100vh;
    background:
      linear-gradient(rgba(8,20,40,.65),rgba(8,20,40,.65)),
      url("freepik__talk__81069.png") center/cover fixed no-repeat;
    color:#f3f4f6;
    animation:fade .7s;
}

/* Animación */
@keyframes fade{
    from{opacity:0; transform:translateY(15px);}
    to{opacity:1; transform:translateY(0);}
}

/* ========= HEADER ========= */
.header{
    max-width:1200px;
    margin:auto;
    padding:clamp(10px,2vw,20px);
    display:flex;
    align-items:center;
    gap:16px;
}
.header img{
    width:clamp(45px,6vw,70px);
    height:auto;
}
.header h1{
    font-size:clamp(20px,4vw,32px);
}

/* ========= NAV ========= */
nav{
    width:100%;
    background:var(--glass);
    backdrop-filter:blur(12px);
    padding:10px 16px;
    box-shadow:var(--shadow);
}

.menu-container{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
}

.menu-links{
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.menu-links a{
    color:white;
    text-decoration:none;
    font-weight:600;
    padding:8px 12px;
    border-radius:10px;
    transition:var(--transition);
}

.menu-links a:hover{
    background:rgba(255,255,255,0.15);
}

/* Botón Contacto */
.btn-contacto{
    padding:10px 18px;
    border-radius:12px;
    background:var(--accent);
    color:var(--primary-dark) !important;
    font-weight:bold;
    border:2px solid transparent;
    transition:var(--transition);
}
.btn-contacto:hover{
    background:transparent;
    color:white !important;
    border:2px solid var(--accent);
}

/* ========= BOTÓN HAMBURGUESA ========= */
.hamb{
    display:none;
    cursor:pointer;
    padding:10px 14px;
    border-radius:12px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(6px);
    transition:var(--transition);
    border:2px solid transparent;
}
.hamb:hover{
    background:var(--accent);
    color:var(--primary-dark);
    border-color:var(--white);
    transform:scale(1.08);
}
.hamb i{
    font-size:26px;
}

/* ========= BUSCADOR ========= */
.buscar-prop{
    width:100%;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

.buscar-prop input, .buscar-prop select{
    padding:10px 14px;
    border-radius:10px;
    border:none;
    width:clamp(120px,30vw,180px);
}

.buscar-prop button{
    padding:10px 14px;
    background:var(--accent);
    border:none;
    border-radius:10px;
    font-weight:bold;
    color:var(--primary-dark);
    cursor:pointer;
    transition:var(--transition);
}
.buscar-prop button:hover{transform:scale(1.05)}

/* ========= RESPONSIVE ========= */
@media(max-width:850px){
    .menu-container{justify-content:space-between;}

    .hamb{display:block;}

    .menu-links{
        position:fixed;
        top:0; right:-100%;
        height:100vh;
        width:75%;
        background:rgba(0,0,0,0.95);
        flex-direction:column;
        padding-top:100px;
        gap:30px;
        transition:var(--transition);
        z-index:999;
    }
    .menu-links a{
        font-size:22px;
        width:80%;
        text-align:center;
        padding:12px 0;
        border-radius:14px;
    }
    .buscar-prop{
        order:3;
        margin-top:12px;
    }
}

/* ========= MAIN ========= */
.main{
    max-width:1200px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:1fr 400px;
    gap:35px;
}

@media(max-width:1000px){
    .main{grid-template-columns:1fr;}
}

/* ========= DESTACADAS ========= */
.destacadas{animation:slideLeft .8s;}
@keyframes slideLeft{
    from{opacity:0; transform:translateX(-40px);}
    to{opacity:1; transform:translateX(0);}
}

.titulo-area{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}
.titulo-area img{
    width:clamp(32px,5vw,50px);
}
.titulo-area h2{
    font-size:clamp(20px,4vw,28px);
}

.galeria{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:18px;
}
.galeria img{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:18px;
    cursor:pointer;
    transition:var(--transition);
    box-shadow:var(--shadow);
}
.galeria img:hover{
    transform:scale(1.03);
    filter:brightness(1.1);
}

/* ========= FORMULARIO PROFESIONAL ========= */
.formulario{
    background:rgba(0,0,0,0.55);
    padding:clamp(20px,4vw,32px);
    border-radius:var(--radius);
    backdrop-filter:blur(14px);
    box-shadow:var(--shadow);
    animation:slideRight .8s;
    color:white;
}

.formulario h1{
    text-align:center;
    margin-bottom:20px;
    font-size:24px;
    color:var(--accent);
}

.campo{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.08);
    padding:10px 14px;
    border-radius:14px;
    margin-bottom:15px;
    border:1px solid rgba(255,255,255,0.15);
}

.campo i{font-size:18px; color:var(--accent);}

.campo input, .campo textarea{
    width:100%;
    background:transparent;
    border:none;
    color:white;
    font-size:15px;
    outline:none;
}

textarea{height:90px; resize:none;}

.btnEnviar{
    width:100%;
    padding:12px;
    background:var(--accent);
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    color:var(--primary-dark);
    transition:var(--transition);
}
.btnEnviar:hover{transform:scale(1.05);}

/* ========= FOOTER PROFESIONAL ========= */
.footer{
    margin-top:50px;
    background:rgba(0,0,0,0.6);
    padding:26px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    color:white;
}

.footer img{
    width:60px;
    filter:brightness(1.1);
}

.footer div{
    line-height:1.4;
}

.footer small{
    opacity:0.8;
}

</style>
</head>
<body>

<header class="header">
    <img src="hormiga-silueta.gif" alt="Morwi">
    <h1>Morwi Soluciones Inmobiliarias</h1>
</header>

<nav>
    <div class="menu-container">

        <div class="hamb" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </div>

        <div class="menu-links" id="menuLinks">
            <a href="contactos.html" class="btn-contacto">Contacto</a>
            <a href="nosotros.html">Sobre Nosotros</a>
            <a href="servi.html">Servicios</a>
            <a href="publicar.html">Publicar</a>
            <a href="ayuda.html">Ayuda</a>
        </div>

        <div class="buscar-prop">
            <select id="tipoOperacion">
                <option value="venta">Venta</option>
                <option value="alquila">Alquiler</option>
                <option value="servicio">Compra</option>
                <option value="emprendimiento">Emprendimiento</option>
            </select>

            <input type="text" placeholder="Localidad" id="buscarLocalidad">

            <button onclick="buscarProp()">Buscar</button>
        </div>

    </div>
</nav>

<!-- MAIN -->
<section class="main">

    <div class="destacadas">
        <div class="titulo-area">
            <img src="Tick_Mark_Circle_icon-icons.com_69145.ico" alt="">
            <h2>Propiedades destacadas</h2>
        </div>

        <div class="galeria">
            <img src="casa01.jpg" onclick="location.href='detalles1.html'">
            <img src="casa02.jpg" onclick="location.href='detalles1.html'">
            <img src="casa01.jpg" onclick="location.href='detalles1.html'">
            <img src="casa02.jpg" onclick="location.href='detalles1.html'">
        </div>
    </div>

    <aside class="formulario">
        <form id="contactForm">
            <h1>Contacto</h1>

            <div class="campo">
                <i class="fa-solid fa-user"></i>
                <input id="nombre" name="nombre" placeholder="Nombre completo" required>
            </div>

            <div class="campo">
                <i class="fa-solid fa-phone"></i>
                <input id="celular" name="celular" placeholder="Celular" required>
            </div>

            <div class="campo">
                <i class="fa-solid fa-envelope"></i>
                <input id="correo" name="correo" type="email" placeholder="Correo electrónico" required>
            </div>

            <div class="campo">
                <i class="fa-solid fa-message"></i>
                <textarea id="mensaje" name="mensaje" placeholder="Mensaje" required></textarea>
            </div>

            <button class="btnEnviar">Enviar mensaje</button>
        </form>
    </aside>

</section>

<footer class="footer">
    <img src="hormiga-silueta.gif">
    <div>
        <strong>Morwi Soluciones Inmobiliarias</strong><br>
        <small>Du Graty · Chaco · +54 3735 531658</small>
    </div>
    <button class="btn-contacto" onclick="location.href='contactos.html'">Contacto</button>
</footer>

<!-- JS -->
<script>

function toggleMenu(){
    let menu = document.getElementById("menuLinks");
    menu.style.right = (menu.style.right === "0px") ? "-100%" : "0px";
}

function buscarProp() {
    let tipo = document.getElementById("tipoOperacion").value;
    let localidad = document.getElementById("buscarLocalidad").value.toLowerCase();

    if(localidad === ""){
        alert("Ingrese una localidad.");
        return;
    }

    let url = tipo + ".html?localidad=" + localidad;
    window.location.href = url;
}

</script>

</body>
</html>
